spring:
  application:
    name: AccessOne-backend

  config:
    import: optional:file:./application-local.yml

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=accessone;encrypt=true;trustServerCertificate=true
    hikari:
      maximum-pool-size: 10
      pool-name: accessone-pool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        use_nationalized_character_data: true
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME:}
    password: ${SMTP_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

accessone:
  storage:
    root: ./storage
  mail:
    from: ${SMTP_FROM:AccessOne <accessoneid@gmail.com>}
    portal-base-url: ${PORTAL_BASE_URL:http://localhost:3000}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    enabled: ${SMTP_ENABLED:true}
  ai:
    enabled: ${AI_ENABLED:true}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}

server:
  port: 8080

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html

logging:
  level:
    org.hibernate.SQL: debug
