spring:
  application:
    name: AccessOne-backend

  config:
    import: optional:file:./application-local.yml

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=accessone;encrypt=true;trustServerCertificate=true

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

server:
  port: 8080

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health

logging:
  level:
    org.hibernate.SQL: debug