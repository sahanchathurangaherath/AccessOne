spring:
  application:
    name: AccessOne-backend

  config:
    import: optional:file:./application-local.yml

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=accessone;encrypt=true;trustServerCertificate=true
    hikari:
      maximum-pool-size: 10
      pool-name: accessone-pool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        use_nationalized_character_data: true
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

server:
  port: 8080

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html

logging:
  level:
    org.hibernate.SQL: debug
